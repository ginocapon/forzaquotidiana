name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          # Esclude tool locali, dipendenze e meta-repo: riduce artifact e timeout deploy.
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'tools/' \
            --exclude '.cursor/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'SKILL.md' \
            --exclude 'SKILL-*.md' \
            --exclude 'NEWSLETTER-SETUP.md' \
            --exclude 'DEPLOY-GITHUB-PAGES.md' \
            --exclude 'README.md' \
            ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
