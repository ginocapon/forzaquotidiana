name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-fq-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site artifact
        run: |
          cp admin/img/esercizi-sprite.svg img/esercizi-sprite.svg
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'training-app/' \
            --exclude 'tools/' \
            --exclude '.cursor/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'SKILL.md' \
            --exclude 'SKILL-*.md' \
            --exclude 'NEWSLETTER-SETUP.md' \
            --exclude 'DEPLOY-GITHUB-PAGES.md' \
            --exclude 'README.md' \
            --exclude 'guardian/' \
            --exclude 'docs/' \
            --exclude 'Righetto_Premortem_Guardian_ONE_COMMAND/' \
            --exclude 'Righetto_Premortem_Guardian_ONE_COMMAND.zip' \
            --exclude 'diario/*.png' \
            ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
