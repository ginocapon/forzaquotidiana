# Venerdì 07:00 CEST (05:00 UTC) — prepara coda editoriale (no API)
# Generazione contenuti: comando utente → Cloud Agent (vedi .cursor/commands/venerdi-editoriale.md)
name: Editorial venerdì

on:
  schedule:
    - cron: '0 5 * * 5'
  workflow_dispatch:
    inputs:
      autopilot:
        description: 'Solo con OPENAI_API_KEY: genera+pubblica in CI (API a consumo)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepara coda (default) o autopilot (opzionale)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITORIAL_API_KEY: ${{ secrets.EDITORIAL_API_KEY }}
          EDITORIAL_LLM_MODEL: ${{ vars.EDITORIAL_MODEL || 'gpt-4o-mini' }}
          EDITORIAL_IMAGE_MODEL: ${{ vars.EDITORIAL_IMAGE_MODEL || 'dall-e-3' }}
        run: |
          if [ "${{ inputs.autopilot }}" = "true" ] && [ -n "$OPENAI_API_KEY$EDITORIAL_API_KEY" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
            node tools/editorial-weekly.mjs run --autopilot
          else
            node tools/editorial-weekly.mjs run --generate
          fi

      - name: Commit coda e report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/editorial-queue.json guardian/reports/weekly-*.md
          if [ "${{ inputs.autopilot }}" = "true" ]; then
            git add diario/ img/diario/ sitemap.xml llms.txt diario/index.html
          fi
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare"
          else
            git commit -m "editorial: coda settimanale $(date -u +%Y-%m-%d)"
            git push
          fi
