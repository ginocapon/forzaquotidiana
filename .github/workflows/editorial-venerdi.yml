# Venerdì 07:00 CEST (05:00 UTC) — autopilot editoriale completo
# Richiede secret OPENAI_API_KEY (o EDITORIAL_API_KEY) nel repository
name: Editorial venerdì (autopilot)

on:
  schedule:
    - cron: '0 5 * * 5'
  workflow_dispatch:
    inputs:
      autopilot:
        description: 'Genera contenuti+immagini+pubblica (serve API key)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dipendenze sistema (ffmpeg per WebP)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Autopilot editoriale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITORIAL_API_KEY: ${{ secrets.EDITORIAL_API_KEY }}
          EDITORIAL_LLM_MODEL: ${{ vars.EDITORIAL_MODEL || 'gpt-4o-mini' }}
          EDITORIAL_IMAGE_MODEL: ${{ vars.EDITORIAL_IMAGE_MODEL || 'dall-e-3' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.autopilot }}" != "true" ]; then
            node tools/editorial-weekly.mjs run --generate
          else
            node tools/editorial-weekly.mjs run --autopilot
          fi

      - name: Commit articoli e asset generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/editorial-queue.json guardian/reports/weekly-*.md diario/ img/diario/ sitemap.xml llms.txt diario/index.html
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare"
          else
            git commit -m "editorial(autopilot): articoli settimanali $(date -u +%Y-%m-%d)"
            git push
          fi
