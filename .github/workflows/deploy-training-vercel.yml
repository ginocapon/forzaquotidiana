# Deploy app Node su Vercel (solo se i secret sono configurati nel repo)
name: Deploy Training App (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training-app/**'

jobs:
  deploy:
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training-app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.TRAINING_APP_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Vercel CLI
        run: npm i -g vercel@59

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
