<head>

<title>PDF scheda sessione | Admin</title>
<meta name="robots" content="noindex, nofollow">

<body class="admin-pdf-page">
<div class="admin-pdf-toolbar no-print">
  <div class="admin-pdf-toolbar__inner">
    <p><strong>Scheda sessione · PDF stampabile</strong></p>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="pdf-print-btn">Stampa / Salva PDF</button>
      <a class="btn btn-ghost" id="pdf-back-link" href="/admin/">Torna alla scheda</a>
      <a class="btn btn-ghost" href="/admin/">Dashboard</a>
    </div>
    <p class="admin-pdf-toolbar__tip"><small>Stampa in <strong>verticale (A4)</strong> · margini standard · sidebar destra per pesi e note</small></p>
  </div>
</div>

<div id="pdf-root"><p style="text-align:center;padding:2rem">Caricamento PDF…</p></div>

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var back = document.getElementById("pdf-back-link");
  if (back && p.get("ciclo")) {
    back.href = "/admin/sessione/?ciclo=" + encodeURIComponent(p.get("ciclo")) + "&sessione=" + (p.get("sessione") || "a1");
    back.textContent = "Scheda online";
  }
})();
</script>
<script src="/admin/js/sessione-pdf.js?v=1" defer></script>
