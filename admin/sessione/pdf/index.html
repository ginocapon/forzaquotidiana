<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF scheda sessione | Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/styles.css?v=69">
<link rel="stylesheet" href="/admin/css/admin-pdf-sessione.css?v=4">
</head>
<body class="admin-pdf-page">
<div class="admin-pdf-toolbar no-print">
  <div class="admin-pdf-toolbar__inner">
    <p><strong>Scheda sessione · PDF stampabile</strong></p>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="pdf-print-btn">Stampa / Salva PDF</button>
      <a class="btn btn-ghost" id="pdf-back-link" href="/admin/">← Schede</a>
      <a class="btn btn-ghost" href="/admin/">Sessioni</a>
    </div>
    <p class="admin-pdf-toolbar__tip"><small>Stampa in <strong>verticale (A4)</strong> · margini <strong>8 mm</strong> · max <strong>2 facciate</strong> · figure grandi · sidebar log</small></p>
  </div>
</div>

<main id="pdf-root"><p style="text-align:center;padding:2rem">Caricamento PDF…</p></main>

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var back = document.getElementById("pdf-back-link");
  if (back && p.get("ciclo")) {
    back.href = "/admin/sessione/?ciclo=" + encodeURIComponent(p.get("ciclo")) + "&sessione=" + (p.get("sessione") || "a1");
    back.textContent = "Scheda online";
  }
})();
</script>
<script src="/js/main.js?v=29" defer></script>
<script src="/admin/js/sprite-esercizi.js?v=4" defer></script>
<script src="/admin/js/sessione-pdf.js?v=5" defer></script>
</body>
</html>
