<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="pianta-title pianta-desc">
  <title id="pianta-title">Pianta che fa bicipiti  vignetta cartoon</title>
  <desc id="pianta-desc">Vignetta stile cartone animato: una pianta in vaso con faccina sorridente e due manine che sollevano manubri, metafora giocosa dell'allenamento dei pensieri positivi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1714"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#2a1e16"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec86a"/>
      <stop offset="100%" stop-color="#3d8f45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d4a0"/>
      <stop offset="100%" stop-color="#c9783a"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <ellipse cx="400" cy="470" rx="280" ry="28" fill="#000" opacity="0.35"/>

  <!-- sparkle stars -->
  <g fill="#f0d4a0" opacity="0.85">
    <path d="M120 90 l6 14 14 6-14 6-6 14-6-14-14-6z"/>
    <path d="M680 120 l5 11 11 5-11 5-5 11-5-11-11-5z"/>
    <path d="M650 380 l4 9 9 4-9 4-4 9-4-9-9-4z"/>
  </g>

  <!-- left dumbbell -->
  <g filter="url(#soft)">
    <rect x="118" y="198" width="74" height="14" rx="7" fill="#8b7355"/>
    <rect x="102" y="186" width="22" height="38" rx="6" fill="url(#gold)"/>
    <rect x="186" y="186" width="22" height="38" rx="6" fill="url(#gold)"/>
  </g>
  <!-- right dumbbell -->
  <g filter="url(#soft)">
    <rect x="608" y="198" width="74" height="14" rx="7" fill="#8b7355"/>
    <rect x="592" y="186" width="22" height="38" rx="6" fill="url(#gold)"/>
    <rect x="676" y="186" width="22" height="38" rx="6" fill="url(#gold)"/>
  </g>

  <!-- arms -->
  <path d="M290 250 C250 230 210 210 170 205" fill="none" stroke="#e8c4a0" stroke-width="18" stroke-linecap="round"/>
  <path d="M510 250 C550 230 590 210 630 205" fill="none" stroke="#e8c4a0" stroke-width="18" stroke-linecap="round"/>
  <circle cx="170" cy="205" r="16" fill="#f2d8bc"/>
  <circle cx="630" cy="205" r="16" fill="#f2d8bc"/>

  <!-- plant stem -->
  <path d="M400 390 C385 330 395 280 400 220 C405 280 415 330 400 390Z" fill="#4fa858"/>
  <ellipse cx="400" cy="220" rx="42" ry="52" fill="url(#leaf)"/>
  <ellipse cx="350" cy="250" rx="34" ry="48" fill="url(#leaf)" transform="rotate(-28 350 250)"/>
  <ellipse cx="450" cy="250" rx="34" ry="48" fill="url(#leaf)" transform="rotate(28 450 250)"/>
  <ellipse cx="400" cy="175" rx="28" ry="36" fill="#8fdc7a"/>

  <!-- face on plant -->
  <ellipse cx="385" cy="210" rx="5" ry="7" fill="#1a1510"/>
  <ellipse cx="415" cy="210" rx="5" ry="7" fill="#1a1510"/>
  <path d="M388 228 Q400 240 412 228" fill="none" stroke="#1a1510" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="372" cy="220" rx="8" ry="5" fill="#ffb0a8" opacity="0.45"/>
  <ellipse cx="428" cy="220" rx="8" ry="5" fill="#ffb0a8" opacity="0.45"/>

  <!-- pot -->
  <path d="M310 390 H490 L505 470 H295 Z" fill="url(#pot)" stroke="#c9783a" stroke-width="3"/>
  <rect x="295" y="378" width="210" height="18" rx="6" fill="#6b4d38"/>

  <!-- caption bubble -->
  <rect x="220" y="42" width="360" height="72" rx="18" fill="#1c1916" stroke="#c9783a" stroke-width="2"/>
  <path d="M360 114 L380 140 L400 114Z" fill="#1c1916" stroke="#c9783a" stroke-width="2"/>
  <text x="400" y="72" text-anchor="middle" fill="#f2ece3" font-family="Georgia, serif" font-size="22" font-style="italic">Allenare i pensieri&</text>
  <text x="400" y="98" text-anchor="middle" fill="#c9783a" font-family="Arial, sans-serif" font-size="18" font-weight="700">una rep positiva alla volta</text>
</svg>
